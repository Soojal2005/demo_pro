name: CI

# Runs on every PR and every push to a long-lived branch. Deploy is gated on
# this workflow succeeding — see deploy.yml — so anything added here becomes a
# release gate.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push to the same ref makes the older run pointless.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ===================================================================
  # Static analysis, unit tests, and a real compile.
  # ===================================================================
  quality:
    name: Lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` runs husky's `prepare`; HUSKY=0 stops it installing hooks on
      # a runner that will never make a commit.
      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Every import in this codebase resolves Prisma's types through
      # src/prisma/client.ts -> generated/prisma. Without this step the
      # typecheck fails on a missing module rather than on a real error.
      - name: Generate Prisma client
        run: npx prisma generate

      # NOT `npm run lint` — that script ends in `--fix`, so on a runner it
      # would silently rewrite the working tree and exit 0 with violations
      # unreported. CI has to fail on what a developer would be asked to fix.
      #
      # There is deliberately no separate `prettier --check` step. Formatting
      # is already an eslint *error* here via `prettier/prettier`, configured
      # with `endOfLine: "auto"`. Running the Prettier CLI as well would add a
      # second, stricter gate that fails on CRLF line endings alone — 17 files
      # currently in the repo fail it for that reason and nothing else.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings=0

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci --runInBand

      - name: Build
        run: npm run build

      # `nest build` exits 0 even if the entrypoint is not where anything
      # expects it, so assert the path the Dockerfile CMD actually uses.
      #
      # It is `dist/src/main.js`, not `dist/main.js`: tsconfig.json sets no
      # `include`/`rootDir`, so prisma.config.ts and prisma/seed.ts join the
      # compilation and the emit root becomes the repo root. `npm run
      # start:prod` still says `node dist/main` and is broken today — this
      # step is what stops the two drifting further apart unnoticed.
      - name: Verify the build entrypoint exists where the container expects it
        run: test -f dist/src/main.js

  # ===================================================================
  # Migrations, against a real Postgres.
  #
  # This is the highest-value job in the file for this repository. Its
  # recurring failure mode is a schema.prisma edit that never got a matching
  # migration, which is invisible until someone deploys — see the drift
  # documented in MODULE_11_SAFETY_SUPPORT_PLAN.md §14.1.
  # ===================================================================
  migrations:
    name: Migrations apply from scratch, and match the schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homingo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homingo_ci
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homingo_shadow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Create the shadow database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c 'CREATE DATABASE homingo_shadow;'

      # Proves every migration in the folder replays cleanly onto an empty
      # database, in order — including the hand-written CHECK constraints,
      # which Prisma does not verify for us.
      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      - name: Confirm no migration is left pending
        run: npx prisma migrate status

      # Catches the actual recurring bug: schema.prisma edited without a
      # matching migration. `--exit-code` returns non-zero when a diff exists.
      - name: Fail if schema.prisma and the migrations have drifted
        run: |
          npx prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      # The seed is executable documentation of the fixtures every other
      # environment depends on; a broken seed is found here or by a developer
      # resetting their database on a Monday morning.
      #
      # `--catalog-only`, not the full seed: `main()` calls
      # `ensureFirebaseUser()` before anything else, which needs a real
      # service-account key. The catalogue path is the branch that exists
      # precisely for credential-less environments.
      #
      # Known limit, so nobody reads more into a green tick than is there:
      # this covers cities, categories and services. The role/permission
      # grants and the notification templates live on the full path and stay
      # unverified by CI until the seed can bootstrap without Firebase.
      - name: Seed runs against a fresh database
        run: npx tsx prisma/seed.ts --catalog-only
        env:
          NODE_ENV: ci

  # ===================================================================
  # e2e — compiles the real AppModule and walks the HTTP surface.
  # ===================================================================
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homingo_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Generate Prisma client
        run: npx prisma generate

      # ConfigModule reads `.env.<NODE_ENV>` then `.env`; neither is committed,
      # so CI writes its own. Several config builders refuse to start when
      # their keys are absent (Redis, S3, Firebase) — these are placeholders
      # that satisfy presence checks without reaching any real service.
      #
      # Deliberately unset: GEOCODER_PROVIDER, ROUTING_PROVIDER, RAZORPAY_*,
      # RAZORPAYX_*, SLIDE_*. Each is optional, and each has a documented
      # degraded path the app takes when it is missing — leaving them out
      # means CI exercises that path rather than a half-configured one.
      - name: Write the CI environment file
        run: |
          cat > .env <<'EOF'
          NODE_ENV=ci
          PORT=3000
          HOST=127.0.0.1
          API_PREFIX=api
          API_VERSION=v1

          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/homingo_e2e

          JWT_SECRET=ci-only-secret-not-used-against-any-real-token
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d

          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_DB=0

          OTP_PROVIDER=mock
          MOCK_OTP_CODE=123456
          OTP_LENGTH=6

          AWS_REGION=ap-south-1
          AWS_S3_BUCKET=homingo-ci-placeholder

          FIREBASE_SERVICE_ACCOUNT_PATH=./secrets/firebase-admin-sdk.json

          COMMISSION_WORKER_ENABLED=false
          SUPPORT_WORKER_ENABLED=false
          NOTIFICATION_WORKER_ENABLED=false
          EOF

      - name: Prepare the database
        run: npx prisma migrate deploy

      - name: End-to-end tests
        run: npm run test:e2e -- --ci --runInBand

  # ===================================================================
  # The container actually builds.
  # ===================================================================
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. This exists so a Dockerfile or
      # .dockerignore change cannot break the image silently, which is easy
      # while the deployment still runs from source on EC2 and nobody builds
      # the image by hand.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          load: true
          tags: homingo-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catches the class of mistake that matters most here: the Prisma client
      # is generated outside node_modules, so a wrong COPY leaves an image
      # that builds and then dies on its first query.
      - name: Verify the runtime artefacts are present
        run: |
          docker run --rm --entrypoint sh homingo-backend:ci -c '
            set -e
            test -f dist/main.js
            test -d generated/prisma
            test -d node_modules/@prisma/adapter-pg
            echo "runtime layout OK"
          '

      - name: Confirm the image does not run as root
        run: |
          user=$(docker run --rm --entrypoint sh homingo-backend:ci -c 'id -un')
          echo "container user: $user"
          test "$user" = "node"
