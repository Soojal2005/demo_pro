name: Deploy Backend

# Manual only, plus an automatic run once CI has passed on main.
#
# `workflow_run` is what makes this safe: the previous version of this file
# triggered on `push` and deployed whatever landed, so a commit that failed
# lint, tests and the build still reached the EC2 box. Now nothing deploys
# unless the CI run for that exact commit went green.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip prisma migrate deploy (use only to roll back app code)'
        type: boolean
        default: false

concurrency:
  # Two deploys running `git pull` and `pm2 restart` against one box at the
  # same time is how a half-updated release happens.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and release
    runs-on: ubuntu-latest

    # Attach the `production` environment in repo settings to get required
    # reviewers and a deployment log. Secrets referenced below can live there
    # rather than at repo scope.
    environment: production

    # For workflow_run, `conclusion` is the only thing separating a passing CI
    # run from a failed one — the event fires either way.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the commit CI actually tested, not whatever main points at
          # by the time this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # ---------------------------------------------------------------
      # Migrations run HERE, not on the box and not in the container.
      #
      # The datasource block in schema.prisma has no `url` (Prisma 7 driver
      # adapter), so the connection string comes from prisma.config.ts — a
      # TypeScript file that needs `tsx`, a dev dependency. The production
      # image installs no dev dependencies, so `prisma migrate deploy` cannot
      # run inside it. The runner has the full toolchain, so it runs here.
      #
      # `migrate deploy` never resets and never generates a migration; on
      # drift it refuses and exits non-zero, which fails the deploy before
      # any code is released. That is the desired behaviour.
      # ---------------------------------------------------------------
      - name: Show what would be applied
        if: ${{ !inputs.skip_migrations }}
        run: npx prisma migrate status || true
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply migrations
        if: ${{ !inputs.skip_migrations }}
        run: npx prisma migrate deploy
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ---------------------------------------------------------------
      # Release.
      #
      # Still the source-on-EC2 + pm2 shape the project already uses, with
      # three corrections:
      #
      # * `npm ci` rather than `npm install`, so the box installs the locked
      #   tree instead of re-resolving it into something CI never tested.
      # * `prisma generate` before the build. The client is generated to
      #   `generated/prisma`, which is gitignored — without this the app
      #   starts and throws on its first query.
      # * A checkout of the exact tested commit rather than `git pull`, so a
      #   commit landing mid-deploy cannot be picked up half-way.
      #
      # Dev dependencies are installed on purpose: `npm run build` is
      # `nest build`, and @nestjs/cli and typescript are both devDependencies.
      # `npm ci --omit=dev` here would fail at the build step.
      # ---------------------------------------------------------------
      - name: Release to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true # abort on the first failing command
          script: |
            set -euo pipefail
            cd /var/www/backend

            git fetch --all --prune
            git checkout --detach ${{ github.event.workflow_run.head_sha || github.sha }}

            export HUSKY=0
            npm ci
            npx prisma generate
            npm run build

            pm2 restart homingo-backend --update-env
            pm2 save

      # A restart that exits 0 and a process that serves traffic are different
      # claims. This checks the second one.
      - name: Smoke-test the released service
        run: |
          for attempt in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "${{ secrets.HEALTHCHECK_URL }}" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Service is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Service did not return 200 within two minutes of release."
          exit 1
